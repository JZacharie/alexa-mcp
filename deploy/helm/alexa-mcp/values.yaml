replicaCount: 1

image:
  repository: ghcr.io/jzacharie/alexa-mcp
  pullPolicy: Always
  tag: "latest"

# The GHCR package is private: reference a docker-registry secret to pull it.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: "traefik"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production-dns
    gethomepage.dev/description: Alexa Shopping List MCP Server
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: MCP
    gethomepage.dev/icon: mdi-format-list-checks
    gethomepage.dev/name: Alexa MCP
    gethomepage.dev/ping: https://alexa-mcp.p.zacharie.org/health
    kubernetes.io/ingress.class: traefik
  hosts:
    - host: alexa-mcp.p.zacharie.org
      paths:
        - path: /
          pathType: Prefix
          port: 8080
  tls:
    - secretName: alexa-mcp-tls
      hosts:
        - alexa-mcp.p.zacharie.org

env:
  BIND_ADDR: "0.0.0.0:8080"
  AMAZON_URL: "https://www.amazon.fr"
  BROWSERLESS_WS_URL: "ws://browserless-chrome.browserless-chrome.svc.cluster.local:3000"
  RUST_LOG: "alexa_mcp=info,tower_http=info"

# Amazon session cookies are embedded in the binary (config/alexa-cookies.json).
# Set ALEXA_COOKIES_JSON through an ExternalSecret to refresh them without
# rebuilding the image.
externalSecret:
  enabled: false
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  targetSecretName: alexa-mcp-secrets
  vaultKey: "apps/productivity/alexa-mcp"
  data:
    - secretKey: ALEXA_COOKIES_JSON
      remoteProperty: alexa_cookies

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
