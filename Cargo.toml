[package]
name = "alexa-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["Joseph Zacharie <contact@zacharie.org>"]
description = "MCP server in Rust to read and manage the Amazon Alexa shopping list"
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
# Async runtime and HTTP/MCP server
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization and observability
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Amazon Alexa HTTP client
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
urlencoding = "2.1"

# Headless browser used only to export the Amazon session cookies
chromiumoxide = { version = "0.6", default-features = false, features = ["tokio-runtime"] }
async-tungstenite = { version = "0.25", features = ["tokio-rustls-native-certs"] }
futures = "0.3"

anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
